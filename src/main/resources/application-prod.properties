# Render / production profile. Secrets must be configured as environment variables.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
spring.thymeleaf.cache=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=70MB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mongo.enabled=true
logging.level.root=INFO
logging.level.in.asmj.ride=INFO
app.upload.max-bytes=${UPLOAD_MAX_BYTES:8388608}
# Cloudinary configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Initial Admin Account
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}


# Demo accounts are explicitly disabled in the production profile.
demo.seed.enabled=false
