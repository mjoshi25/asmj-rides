<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications · ASMJ Ride</title><link rel="stylesheet" href="/css/app.css?v=phase7-account-profile-nav-fix-20261122"><meta name="theme-color" content="#10243d"><link rel="icon" type="image/svg+xml" href="/images/asmj-ride-mark.svg"><link rel="apple-touch-icon" href="/images/asmj-ride-mark.svg"></head><body><header th:replace="~{fragments/navigation :: authenticatedHeader('NOTIFICATIONS')}"></header><main class="panel"><h1>Notifications</h1><p class="muted" th:text="${unreadCount}+' unread notification(s)'"></p><div class="ride-list"><article class="ride" th:each="n:${notifications}"><div><b th:text="${n.title}"></b><p th:text="${n.message}"></p><small th:text="${n.createdAt}"></small><p><a th:if="${n.link != null}" th:href="${n.link}">Open related page</a></p></div><form th:if="${!n.read}" method="post" th:action="@{'/notifications/'+${n.id}+'/read'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn secondary" type="submit">Mark as read</button></form><span th:if="${n.read}" class="muted">Read</span></article><p th:if="${#lists.isEmpty(notifications)}">You do not have any notifications yet.</p></div></main><script src="/js/app-ui.js?v=phase7-account-profile-nav-fix-20261122" defer></script></body></html>
