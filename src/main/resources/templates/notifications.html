<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications · ASMJ Ride</title><link rel="stylesheet" href="/css/app.css?v=ride-release-v2"></head><body><header class="app-header"><b>ASMJ Ride / Notifications</b><button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false"><span></span><span></span><span></span></button><nav class="site-nav"><a href="/dashboard">Dashboard</a><a href="/support">Support</a><a href="/notifications">Notifications</a><form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="linkbtn logout-btn" type="submit">Logout</button></form></nav></header><main class="panel"><h1>Notifications</h1><p class="muted" th:text="${unreadCount}+' unread notification(s)'"></p><div class="ride-list"><article class="ride" th:each="n:${notifications}"><div><b th:text="${n.title}"></b><p th:text="${n.message}"></p><small th:text="${n.createdAt}"></small><p><a th:if="${n.link != null}" th:href="${n.link}">Open related page</a></p></div><form th:if="${!n.read}" method="post" th:action="@{'/notifications/'+${n.id}+'/read'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn secondary" type="submit">Mark as read</button></form><span th:if="${n.read}" class="muted">Read</span></article><p th:if="${#lists.isEmpty(notifications)}">You do not have any notifications yet.</p></div></main><script src="/js/app-ui.js?v=20261107" defer></script></body></html>
