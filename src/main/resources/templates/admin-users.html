<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounts · ASMJ Ride</title><link rel="stylesheet" href="/css/app.css?v=phase7-account-profile-nav-fix-20261122"><meta name="theme-color" content="#10243d"><link rel="icon" type="image/svg+xml" href="/images/asmj-ride-mark.svg"><link rel="apple-touch-icon" href="/images/asmj-ride-mark.svg"></head><body class="page-admin-users"><header th:replace="~{fragments/navigation :: authenticatedHeader('ADMIN')}"></header><main class="panel"><h1>Platform accounts &amp; roles</h1><p><a class="btn" href="/admin/role-requests">Review additional role requests</a></p><p class="error" th:if="${param.documentsRequired != null}">Approval blocked: verify the required partner documents in <a href="/admin/uploads">Upload Review</a>.</p><p><a href="/admin/operations">Operations dashboard</a></p><article class="ride" th:each="u:${users}"><div><b th:text="${u.name}+' · '+${u.roles}"></b><p th:text="${u.email}+' · '+${u.mobile}"></p><small th:text="'Status: '+${u.status}+' · Mobile verified: '+${u.mobileVerified}"></small></div><form method="post" th:action="@{'/admin/users/'+${u.id}+'/status'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="status"><option>APPROVED</option><option>PENDING</option><option>REJECTED</option><option>SUSPENDED</option></select><button class="btn">Update</button></form></article></main><footer class="site-footer"><div class="footer-inner"><a class="footer-brand" href="/"><img class="brand-logo brand-logo-light" src="/images/asmj-ride-logo-white.svg" alt="ASMJ Ride"></a><p>Move comfortably. Travel confidently.</p><div class="footer-links">

<a href="/support">Support</a>
