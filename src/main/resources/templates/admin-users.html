<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounts · ASMJ Ride</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="panel"><h1>Customer, driver & fleet accounts</h1><p><a href="/admin/operations">Operations dashboard</a></p><article class="ride" th:each="u:${users}"><div><b th:text="${u.name}+' · '+${u.role}"></b><p th:text="${u.email}+' · '+${u.mobile}"></p><small th:text="'Status: '+${u.status}+' · Mobile verified: '+${u.mobileVerified}"></small></div><form method="post" th:action="@{'/admin/users/'+${u.id}+'/status'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="status"><option>APPROVED</option><option>PENDING</option><option>REJECTED</option><option>SUSPENDED</option></select><button class="btn">Update</button></form></article></main></body></html>
