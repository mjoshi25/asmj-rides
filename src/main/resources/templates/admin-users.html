<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounts · ASMJ Ride</title><link rel="stylesheet" href="/css/app.css?v=20261103"></head><body><header class="app-header"><b>ASMJ Ride <span class="admin-nav-note">/ ADMIN CONSOLE</span></b><nav aria-label="Admin navigation"><a href="/admin">Overview</a><a href="/admin/operations">Analytics</a><a href="/admin/rides">Rides</a><a href="/admin/users">Accounts</a><a href="/admin/fares">Fares</a><a href="/admin/uploads">Documents</a><a href="/admin/safety">Safety</a><a href="/admin/reviews">Reviews</a><a href="/payments">Payments</a><a href="/support">Support</a><form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="linkbtn" type="submit">Logout</button></form></nav></header><main class="panel"><h1>Customer, driver & fleet accounts</h1><p class="error" th:if="${param.documentsRequired != null}">Approval blocked: verify the required partner documents in <a href="/admin/uploads">Upload Review</a>.</p><p><a href="/admin/operations">Operations dashboard</a></p><article class="ride" th:each="u:${users}"><div><b th:text="${u.name}+' · '+${u.role}"></b><p th:text="${u.email}+' · '+${u.mobile}"></p><small th:text="'Status: '+${u.status}+' · Mobile verified: '+${u.mobileVerified}"></small></div><form method="post" th:action="@{'/admin/users/'+${u.id}+'/status'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="status"><option>APPROVED</option><option>PENDING</option><option>REJECTED</option><option>SUSPENDED</option></select><button class="btn">Update</button></form></article></main></body></html>
