<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner · ASMJ Ride</title><link rel="stylesheet" href="/css/app.css"></head><body><header><b>ASMJ Ride · Partner</b><nav><a href="/partner">Dashboard</a><form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="linkbtn">Logout</button></form></nav></header><main class="panel"><h1 th:text="|Welcome ${name}|"></h1><p>Register vehicles. Fleet owners can link an approved driver to a fleet vehicle by the driver's registered email.</p><form method="post" th:action="@{/partner/vehicle}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Category</label><select name="category"><option>CAR</option><option>AUTO</option><option>BIKE</option><option>OTHER</option></select><label>Registration number</label><input name="registrationNumber" required><label>Make / model</label><input name="model"><button class="btn">Submit vehicle</button></form><h2>Your vehicles</h2><div class="ride-list"><article class="ride" th:each="v:${vehicles}"><div><b th:text="${v.registrationNumber}"></b><p th:text="${v.category}+' · '+${v.model}+' · '+${v.status}"></p><small th:if="${v.assignedDriverId}" th:text="'Assigned driver ID: '+${v.assignedDriverId}"></small></div><form th:if="${role=='FLEET_OWNER'}" method="post" th:action="@{'/partner/vehicle/'+${v.id}+'/assign'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="driverEmail" type="email" placeholder="Approved driver email" required><button class="btn secondary">Assign driver</button></form></article></div></main></body></html>
