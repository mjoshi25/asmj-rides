<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fare settings · ASMJ Ride</title><link rel="stylesheet" href="/css/app.css"></head><body><header><b>ASMJ Ride · Admin</b><nav><a href="/admin">Dashboard</a><a href="/admin/rides">Ride operations</a></nav></header><main class="panel"><h1>Fare &amp; pricing rules</h1><p>Changes apply to new fare estimates and trip completions. Values are in INR.</p><p class="success" th:if="${param.saved}">Fare rules saved.</p><p class="error" th:if="${param.error}">One or more values are outside the permitted range.</p><form method="post" action="/admin/fares" class="booking"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><h2>Base pricing</h2><label>Base fare (₹)</label><input type="number" name="baseFare" min="0" max="10000" step="0.01" th:value="${fare.baseFare}" required><label>Per kilometre (₹)</label><input type="number" name="perKm" min="0" max="1000" step="0.01" th:value="${fare.perKm}" required><label>Per minute (₹)</label><input type="number" name="perMinute" min="0" max="500" step="0.01" th:value="${fare.perMinute}" required><label>Minimum fare (₹)</label><input type="number" name="minimumFare" min="0" max="10000" step="0.01" th:value="${fare.minimumFare}" required><label>Waiting charge per minute (₹)</label><input type="number" name="waitingPerMinute" min="0" max="500" step="0.01" th:value="${fare.waitingPerMinute}" required><h2>Night pricing</h2><label>Night multiplier</label><input type="number" name="nightMultiplier" min="1" max="5" step="0.05" th:value="${fare.nightMultiplier}" required><label>Night start hour (0–23)</label><input type="number" name="nightStartHour" min="0" max="23" th:value="${fare.nightStartHour}" required><label>Night end hour (0–23)</label><input type="number" name="nightEndHour" min="0" max="23" th:value="${fare.nightEndHour}" required><label>Cancellation charge after driver acceptance (₹)</label><input type="number" name="cancellationFee" min="0" max="5000" step="0.01" th:value="${fare.cancellationFee}" required><h2>Vehicle category multipliers</h2><label>Car multiplier</label><input type="number" name="carMultiplier" min="0.1" max="5" step="0.05" th:value="${fare.carMultiplier}" required><label>Auto multiplier</label><input type="number" name="autoMultiplier" min="0.1" max="5" step="0.05" th:value="${fare.autoMultiplier}" required><label>Bike multiplier</label><input type="number" name="bikeMultiplier" min="0.1" max="5" step="0.05" th:value="${fare.bikeMultiplier}" required><label>Other category multiplier</label><input type="number" name="otherMultiplier" min="0.1" max="5" step="0.05" th:value="${fare.otherMultiplier}" required><h2>Platform commission</h2><label>Individual driver commission (%)</label><input type="number" name="individualCommissionPercent" min="0" max="50" step="0.5" th:value="${fare.individualCommissionPercent}" required><label>Fleet partner commission (%)</label><input type="number" name="fleetCommissionPercent" min="0" max="50" step="0.5" th:value="${fare.fleetCommissionPercent}" required><button class="btn">Save fare rules</button></form></main></body></html>
