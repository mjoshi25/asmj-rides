<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verify mobile · ASMJ Ride</title>
  <link rel="stylesheet" href="/css/app.css?v=ride-release-v2">
</head>
<body>
<main class="auth">
  <a href="/" class="brand"><b>ASMJ Ride</b></a>
  <h1>Verify your mobile</h1>
  <p>We will send a one-time password to your registered mobile number.</p>
  <p><strong th:text="${email}">user@example.com</strong></p>
  <p class="muted" th:if="${mobileHint}" th:text="'Mobile: '+${mobileHint}"></p>
  <p class="error" th:if="${error}" th:text="${error}"></p>
  <p class="success" th:if="${success}" th:text="${success}"></p>
  <p class="otp" th:if="${devOtp}">Development OTP: <b th:text="${devOtp}"></b></p>
  <form method="post" action="/otp/request">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" name="email" th:value="${email}">
    <button class="btn secondary" type="submit" th:disabled="${providerReady == false}">Send / Resend OTP</button>
  </form>
  <form method="post" action="/otp/verify">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" name="email" th:value="${email}">
    <label for="otp">Enter the OTP</label>
    <input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4,9}" minlength="4" maxlength="9" placeholder="6-digit OTP" required>
    <button class="btn" type="submit">Verify mobile</button>
  </form>
  <p><a href="/login">Back to sign in</a></p>
</main>
</body>
</html>
