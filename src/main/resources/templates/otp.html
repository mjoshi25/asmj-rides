<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify mobile</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="auth"><b>ASMJ Ride</b><h1>Verify mobile</h1><p th:text="${email}"></p><p class="error" th:if="${error}" th:text="${error}"></p><p class="success" th:if="${success}" th:text="${success}"></p><p class="otp" th:if="${devOtp}">Development OTP: <b th:text="${devOtp}"></b></p><form method="post" action="/otp/request"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="email" th:value="${email}"><button class="btn secondary">Generate OTP</button></form><form method="post" action="/otp/verify"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="email" th:value="${email}"><label>6-digit OTP</label><input name="otp" maxlength="6" required><button class="btn">Verify</button></form></main></body></html>
