<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safety reports · ASMJ Ride</title><link rel="stylesheet" href="/css/app.css?v=phase6-unified-navigation-20261122"><meta name="theme-color" content="#10243d"><link rel="icon" type="image/svg+xml" href="/images/asmj-ride-mark.svg"><link rel="apple-touch-icon" href="/images/asmj-ride-mark.svg"></head><body class="page-admin-safety"><header th:replace="~{fragments/navigation :: authenticatedHeader('ADMIN')}"></header><main class="panel"><h1>Safety, SOS, lost item & fraud reports</h1><article class="ride" th:each="s:${reports}"><div><b th:text="${s.type}+' · '+${s.status}"></b><p th:text="${s.userName}+' · Ride '+${s.rideId}"></p><p th:text="${s.details}"></p><small th:text="${s.adminNote}"></small></div><form method="post" th:action="@{'/admin/safety/'+${s.id}}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="status"><option>IN_PROGRESS</option><option>RESOLVED</option><option>CLOSED</option></select><input name="note" placeholder="Action / follow-up note"><button class="btn">Update</button></form></article><p th:if="${#lists.isEmpty(reports)}">No reports recorded.</p></main><footer class="site-footer"><div class="footer-inner"><a class="footer-brand" href="/"><img class="brand-logo brand-logo-light" src="/images/asmj-ride-logo-white.svg" alt="ASMJ Ride"></a><p>Move comfortably. Travel confidently.</p><div class="footer-links">
<a href="/" >Home</a>
<a href="/support">Support</a>
<span sec:authorize="isAuthenticated()"><a href="/dashboard">Dashboard</a></span>
<span sec:authorize="isAnonymous()"><a href="/login">Sign in</a><a href="/register">Create account</a></span>
<span sec:authorize="isAuthenticated()"><form method="post" action="/logout" class="footer-logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Logout</button></form></span>
</div><small>© 2026 ASMJ Ride. All rights reserved.</small></div></footer><script src="/js/app-ui.js?v=phase6-unified-navigation-20261122" defer></script></body></html>
