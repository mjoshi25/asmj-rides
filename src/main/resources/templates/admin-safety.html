<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safety reports · ASMJ Ride</title><link rel="stylesheet" href="/css/app.css?v=20261103"></head><body><header class="app-header"><b>ASMJ Ride <span class="admin-nav-note">/ ADMIN CONSOLE</span></b><nav aria-label="Admin navigation"><a href="/admin">Overview</a><a href="/admin/operations">Analytics</a><a href="/admin/rides">Rides</a><a href="/admin/users">Accounts</a><a href="/admin/mobile-verifications">Mobile verification</a><a href="/admin/fares">Fares</a><a href="/admin/uploads">Documents</a><a href="/admin/safety">Safety</a><a href="/admin/reviews">Reviews</a><a href="/payments">Payments</a><a href="/support">Support</a><form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="linkbtn" type="submit">Logout</button></form></nav></header><main class="panel"><h1>Safety, SOS, lost item & fraud reports</h1><article class="ride" th:each="s:${reports}"><div><b th:text="${s.type}+' · '+${s.status}"></b><p th:text="${s.userName}+' · Ride '+${s.rideId}"></p><p th:text="${s.details}"></p><small th:text="${s.adminNote}"></small></div><form method="post" th:action="@{'/admin/safety/'+${s.id}}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="status"><option>IN_PROGRESS</option><option>RESOLVED</option><option>CLOSED</option></select><input name="note" placeholder="Action / follow-up note"><button class="btn">Update</button></form></article><p th:if="${#lists.isEmpty(reports)}">No reports recorded.</p></main></body></html>
