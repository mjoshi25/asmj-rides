<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviews · ASMJ Ride</title><link rel="stylesheet" href="/css/app.css?v=20261103"></head><body><header class="app-header"><b>ASMJ Ride <span class="admin-nav-note">/ ADMIN CONSOLE</span></b><nav aria-label="Admin navigation"><a href="/admin">Overview</a><a href="/admin/operations">Analytics</a><a href="/admin/rides">Rides</a><a href="/admin/users">Accounts</a><a href="/admin/fares">Fares</a><a href="/admin/uploads">Documents</a><a href="/admin/safety">Safety</a><a href="/admin/reviews">Reviews</a><a href="/payments">Payments</a><a href="/support">Support</a><form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="linkbtn" type="submit">Logout</button></form></nav></header><main class="panel"><h1>Ride ratings & reviews</h1><article class="ride" th:each="r:${reviews}"><b th:text="'Ride '+${r.rideId}"></b><p th:text="'Customer rating: '+${r.customerRating}+'/5 · Driver rating: '+${r.driverRating}+'/5'"></p><p th:text="${r.comment}"></p></article><p th:if="${#lists.isEmpty(reviews)}">No reviews yet.</p></main></body></html>
