<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviews · ASMJ Ride</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="panel"><h1>Ride ratings & reviews</h1><article class="ride" th:each="r:${reviews}"><b th:text="'Ride '+${r.rideId}"></b><p th:text="'Customer rating: '+${r.customerRating}+'/5 · Driver rating: '+${r.driverRating}+'/5'"></p><p th:text="${r.comment}"></p></article><p th:if="${#lists.isEmpty(reviews)}">No reviews yet.</p></main></body></html>
