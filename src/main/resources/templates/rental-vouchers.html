<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rental vouchers · ASMJ Ride</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments/navigation :: authenticatedHeader('DISCOUNT VOUCHERS')}"></header><main class="panel"><p class="eyebrow">PROVIDER PROMOTIONS</p><h1>Discount vouchers</h1><p>Create offers for customers. No Admin approval is required. Customers receive an in-app notification when a voucher is published.</p><form method="post" action="/rentals/vouchers/create"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Voucher code<input name="code" required minlength="4" maxlength="20" pattern="[A-Za-z0-9_-]+" placeholder="RIDE20"></label><label>Offer title<input name="title" required maxlength="100"></label><label>Discount type<select name="discountType"><option value="PERCENT">Percentage</option><option value="FIXED">Fixed amount (₹)</option></select></label><label>Discount value<input name="discountValue" type="number" min="0.01" step="0.01" required></label><label>Minimum booking amount (₹)<input name="minimumBookingAmount" type="number" min="0" value="0"></label><label>Maximum discount (₹, 0 = no cap)<input name="maximumDiscountAmount" type="number" min="0" value="0"></label><label>Maximum total uses<input name="maximumUses" type="number" min="1" value="100"></label><label>Uses per customer<input name="maximumUsesPerCustomer" type="number" min="1" value="1"></label><label>Starts at<input name="startsAt" type="datetime-local" required></label><label>Expires at<input name="expiresAt" type="datetime-local" required></label><fieldset><legend>Apply to selected vehicles (leave empty for all vehicles you manage)</legend><label th:each="v:${vehicles}"><input type="checkbox" name="vehicleIds" th:value="${v.id}"><span th:text="${v.category+' · '+v.model+' · '+v.registrationNumber}"></span></label></fieldset><button class="btn" type="submit">Publish voucher</button></form><h2>Your vouchers</h2><article class="ride" th:each="v:${vouchers}"><h3 th:text="${v.code+' · '+v.title}"></h3><p th:text="${v.discountType=='PERCENT'?v.discountValue+'% off':'₹'+v.discountValue+' off'}"></p><p th:text="|Status: ${v.status} · Redeemed: ${v.redeemedCount}/${v.maximumUses}|"></p><form th:if="${v.status=='ACTIVE'}" method="post" th:action="@{'/rentals/vouchers/'+${v.id}+'/disable'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn secondary" type="submit">Disable voucher</button></form></article><a href="/rentals/provider">Back to rental bookings</a></main></body></html>
