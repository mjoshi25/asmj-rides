<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Available vehicles · ASMJ Ride</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments/navigation :: authenticatedHeader('AVAILABLE VEHICLES')}"></header><main class="panel"><p class="eyebrow">MATCHING VEHICLES</p><h1>Available for your route</h1><p th:text="|${pickupKey} → ${dropKey} · ${mode} · ${journey}|">Route details</p><div th:if="${#lists.isEmpty(vehicles)}" class="notice">No vehicles match this route and time. Try another date or route.</div><section class="rental-result-grid"><article class="ride rental-result-card" th:each="v:${vehicles}"><h2 th:text="${v.category+' · '+v.model}">Vehicle</h2><p th:text="${v.registrationNumber}"></p><p th:text="${v.supportsWithDriver and v.supportsSelfDrive ? 'With driver / Self-drive' : (v.supportsWithDriver ? 'With driver' : 'Self-drive')}"></p><p class="muted">Provider will confirm the final fare after reviewing your request.</p><form method="post" action="/rentals/book"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="vehicleId" th:value="${v.id}"><input type="hidden" name="pickupKey" th:value="${pickupKey}"><input type="hidden" name="dropKey" th:value="${dropKey}"><input type="hidden" name="pickupAt" th:value="${pickupAt}"><input type="hidden" name="returnAt" th:value="${returnAt}"><input type="hidden" name="journey" th:value="${journey}"><input type="hidden" name="mode" th:value="${mode}"><label>Note (optional)<input name="note" maxlength="500" placeholder="Luggage, pickup instructions..."></label><button class="btn" type="submit">Request booking</button></form></article></section><a href="/rentals/search">Change search</a></main></body></html>
