<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find a rental · ASMJ Ride</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments/navigation :: authenticatedHeader('RENTAL SEARCH')}"></header><main class="panel rental-panel"><p class="eyebrow">VEHICLE RENTAL MARKETPLACE</p><h1>Find a vehicle for your route</h1><p>Search approved vehicles that cover your pickup, destination and travel dates.</p><form method="post" action="/rentals/search" class="rental-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Pickup city and PIN<select name="pickupKey" required><option value="">Select pickup location</option><th:block th:each="c:${cities}"><option th:each="pin:${c.pinCodes}" th:value="${c.id+'::'+pin}" th:text="${c.city+' · '+pin}"></option></th:block></select></label><label>Destination city and PIN<select name="dropKey" required><option value="">Select destination</option><th:block th:each="c:${cities}"><option th:each="pin:${c.pinCodes}" th:value="${c.id+'::'+pin}" th:text="${c.city+' · '+pin}"></option></th:block></select></label><label>Pickup date and time<input type="datetime-local" name="pickupAt" required></label><label>Return date and time<input type="datetime-local" name="returnAt" required></label><label>Journey type<select name="journey"><option value="ONE_WAY">One-way</option><option value="ROUND_TRIP">Round trip</option></select></label><label>Rental mode<select name="mode"><option value="WITH_DRIVER">With driver</option><option value="SELF_DRIVE">Self-drive</option></select></label><button class="btn" type="submit">Search available vehicles</button></form><p class="muted">Availability is rechecked when you submit a booking request. A request is not confirmed until the provider accepts it.</p></main></body></html>
