<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ride operations · ASMJ Ride</title><link rel="stylesheet" href="/css/app.css"></head><body><header><b>ASMJ Ride · Admin</b><nav><a href="/admin">Dashboard</a><form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="linkbtn">Logout</button></form></nav></header><main class="panel"><h1>Ride operations</h1><p>Monitor booking requests, driver assignments and trip status.</p><div class="ride-list"><article class="ride" th:each="r:${rides}"><div><b th:text="${r.pickup}+' → '+${r.destination}"></b><p th:text="${r.customerName}+' · '+${r.category}+' · '+${r.tripType}"></p><small th:text="'Status: '+${r.status}+' | Payment: '+${r.paymentMethod}"></small><p th:if="${r.finalFare>0}" th:text="'Final fare: ₹'+${r.finalFare}"></p><p th:if="${r.cancellationCharge>0}" th:text="'Cancellation charge: ₹'+${r.cancellationCharge}"></p><p th:if="${r.actualDistanceKm>0}" th:text="'Actual distance: '+${r.actualDistanceKm}+' km · Duration: '+${r.actualDurationMinutes}+' min · Waiting: '+${r.waitingMinutes}+' min'"></p><p th:if="${r.assignedDriverName}" th:text="'Driver: '+${r.assignedDriverName}+' · '+${r.assignedVehicleNumber}"></p></div><form th:if="${r.status!='COMPLETED' and r.status!='CANCELLED'}" method="post" th:action="@{'/admin/rides/'+${r.id}+'/cancel'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn danger">Cancel ride</button></form></article><p th:if="${#lists.isEmpty(rides)}">No rides have been booked yet.</p></div></main></body></html>
