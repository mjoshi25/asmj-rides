<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="/css/app.css?v=20261103"></head><body><main class="auth"><b>ASMJ Ride</b><h1>Create account</h1><p class="error" th:if="${error}" th:text="${error}"></p><form method="post" action="/register"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>10-digit mobile</label><input name="mobile" pattern="[0-9]{10}" maxlength="10" required><label>Password (8+ characters)</label><input name="password" type="password" minlength="8" required><label>Account type</label><select name="role"><option value="CUSTOMER">Customer</option><option value="DRIVER">Individual driver</option><option value="FLEET_OWNER">Fleet owner</option></select><button class="btn">Register</button></form></main></body></html>
