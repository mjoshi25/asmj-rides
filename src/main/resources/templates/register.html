<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="/css/app.css?v=20261104-nav-fix-v3"></head><body class="page-register"><header class="auth-header"><a class="footer-brand" href="/"><span class="brand-mark">A</span><span>ASMJ <strong>Ride</strong></span></a><a class="auth-home-link" href="/">Back to home</a></header><main class="auth"><b>ASMJ Ride</b><h1>Create account</h1><p class="error" th:if="${error}" th:text="${error}"></p><form method="post" action="/register"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>10-digit mobile</label><input name="mobile" pattern="[0-9]{10}" maxlength="10" required><label>Password (8+ characters)</label><input name="password" type="password" minlength="8" required><label>Account type</label><select name="role"><option value="CUSTOMER">Customer</option><option value="DRIVER">Individual driver</option><option value="FLEET_OWNER">Fleet owner</option></select><button class="btn">Register</button></form></main><footer class="site-footer"><div class="footer-inner"><a class="footer-brand" href="/"><span class="brand-mark">A</span><span>ASMJ <strong>Ride</strong></span></a><p>Move comfortably. Travel confidently.</p><div class="footer-links">

<a href="/support">Chat with Admin</a>
<span sec:authorize="isAuthenticated()"><a href="/dashboard">Dashboard</a></span>
<span sec:authorize="isAnonymous()"><a href="/login">Sign in</a><a href="/register">Create account</a></span>
