<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rental operations · ASMJ Ride</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments/navigation :: authenticatedHeader('RENTAL OPERATIONS')}"></header><main class="panel"><p class="eyebrow">FLEET & AGENCY MANAGEMENT</p><h1>Rental booking requests</h1><article class="ride" th:each="b:${bookings}"><h2 th:text="|Booking ${b.id}|">Booking</h2><p th:text="|${b.pickupAddress} → ${b.dropAddress}|"></p><p th:text="|${b.pickupAt} – ${b.returnAt} · ${b.rentalMode} · ${b.rentalType}|"></p><p>Status: <strong th:text="${b.status}"></strong> · Payment: <strong th:text="${b.paymentStatus}"></strong></p><form th:if="${b.status=='REQUESTED'}" method="post" th:action="@{'/rentals/'+${b.id}+'/accept'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Quoted fare (₹)<input type="number" name="quotedAmount" min="1" step="0.01" required></label><label>Payment instructions for this booking (optional; overrides vehicle instructions)<textarea name="paymentInstructions" maxlength="1000" placeholder="Your UPI ID / bank details / cash instructions"></textarea></label><label th:if="${b.rentalMode=='WITH_DRIVER'}">Assign approved driver<select name="driverId" required><option value="">Select driver</option><option th:each="d:${drivers}" th:value="${d.id}" th:text="${d.name+' · '+d.mobile}"></option></select></label><button class="btn" type="submit">Accept &amp; quote</button></form><form th:if="${b.status=='REQUESTED'}" method="post" th:action="@{'/rentals/'+${b.id}+'/reject'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="reason" placeholder="Optional reason"><button class="btn secondary" type="submit">Decline request</button></form><form th:if="${b.status=='DRIVER_DECLINED'}" method="post" th:action="@{'/rentals/'+${b.id}+'/driver/reassign'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Choose another approved driver<select name="driverId" required><option value="">Select driver</option><option th:each="d:${drivers}" th:value="${d.id}" th:text="${d.name+' · '+d.mobile}"></option></select></label><button class="btn">Reassign driver</button></form><form th:if="${b.status=='ACCEPTED' and b.rentalMode=='SELF_DRIVE'}" method="post" th:action="@{'/rentals/'+${b.id}+'/self-drive/complete'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><h3>Close self-drive rental &amp; issue invoice</h3><label>Handover odometer (km)<input type="number" name="startKm" min="0" step="0.1" required></label><label>Return odometer (km)<input type="number" name="endKm" min="0.1" step="0.1" required></label><label>Final fare (₹)<input type="number" name="finalAmount" min="1" step="0.01" required></label><button class="btn">Complete rental &amp; issue invoice</button></form><div th:if="${b.paymentStatus=='REPORTED'}"><p th:text="|Customer reports ${b.paymentMethod} payment. Reference: ${b.paymentReference}|"></p><form method="post" th:action="@{'/rentals/'+${b.id}+'/payment/verify'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn" name="decision" value="VERIFY">Verify received payment</button><button class="btn secondary" name="decision" value="DISPUTE">Dispute / not received</button><input name="reason" placeholder="Reason if disputed"></form></div></article></main></body></html>
