<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rental driver tasks · ASMJ Ride</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments/navigation :: authenticatedHeader('DRIVER RENTALS')}"></header><main class="panel"><p class="eyebrow">DRIVER PORTAL</p><h1>Rental assignments</h1><article class="ride" th:each="b:${bookings}"><h2 th:text="|Rental ${b.id}|">Rental</h2><p th:text="|${b.pickupAddress} → ${b.dropAddress}|"></p><p th:text="|${b.pickupAt} – ${b.returnAt}|"></p><p>Status: <strong th:text="${b.status}"></strong></p><form th:if="${b.status=='DRIVER_ASSIGNED'}" method="post" th:action="@{'/rentals/'+${b.id}+'/driver/respond'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn" name="response" value="ACCEPT">Accept assignment</button><button class="btn secondary" name="response" value="DECLINE">Decline</button></form><form th:if="${b.status=='DRIVER_ACCEPTED'}" method="post" th:action="@{'/rentals/'+${b.id}+'/journey/start'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Starting odometer (km)<input type="number" name="startKm" min="0" step="0.1" required></label><button class="btn">Start journey</button></form><form th:if="${b.status=='IN_PROGRESS'}" method="post" th:action="@{'/rentals/'+${b.id}+'/journey/complete'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><p th:text="|Starting odometer: ${b.startKm} km|"></p><label>Ending odometer (km)<input type="number" name="endKm" th:attr="min=${b.startKm+0.1}" step="0.1" required></label><button class="btn">Complete journey &amp; issue invoice</button></form></article></main></body></html>
