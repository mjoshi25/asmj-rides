<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="/css/app.css?v=20261103"></head><body><main class="auth"><b>ASMJ Ride</b><h1>Welcome back</h1><p class="success" th:if="${success}" th:text="${success}"></p><p class="error" th:if="${error}" th:text="${error}"></p><p class="error" th:if="${param.error}">Login failed. Check your email and password. If your mobile is not verified, enter the security code provided by ASMJ Ride support. Driver and fleet accounts also require approval.</p><form method="post" action="/login"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Email</label><input name="username" type="email" required><label>Password</label><input name="password" type="password" required><button class="btn">Sign in</button></form><p><a href="/register">Create an account</a></p><p><a href="/verify-mobile">Not verified yet? Enter your admin-issued security code</a></p></main></body></html>
