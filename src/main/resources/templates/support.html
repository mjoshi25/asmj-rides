<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support · ASMJ Ride</title><link rel="stylesheet" href="/css/app.css"></head><body><header><b>ASMJ Ride · Support & safety</b><nav><a href="/dashboard">Dashboard</a><a href="/payments">Payments</a></nav></header><main class="panel"><h1>Support centre</h1><p class="success" th:if="${param.created}">Your support ticket was created.</p><p class="success" th:if="${param.sosSent}">SOS alert recorded. This app does not contact emergency services automatically; contact local emergency services directly if in immediate danger.</p><form th:if="${!admin}" method="post" action="/support/create" class="booking"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><h2>Create support ticket</h2><label>Related ride (optional)</label><select name="rideId"><option value="">General enquiry</option><option th:each="r:${rides}" th:value="${r.id}" th:text="${r.pickup}+' → '+${r.destination}+' ('+${r.status}+')'"></option></select><label>Category</label><select name="category"><option>GENERAL</option><option>PAYMENT</option><option>TRIP</option><option>DRIVER</option><option>SAFETY</option><option>LOST_ITEM</option><option>OTHER</option></select><label>Subject</label><input name="subject" maxlength="120" required><label>Details</label><textarea name="message" maxlength="2000" required></textarea><button class="btn">Submit ticket</button></form><h2 th:text="${admin?'All support tickets':'My support tickets'}"></h2><article class="ride" th:each="t:${tickets}"><div><b th:text="${t.subject}+' · '+${t.status}"></b><p th:text="${t.userName}+' · '+${t.category}+' · '+${t.message}"></p><small th:text="'Ride: '+${t.rideId}"></small><p th:if="${t.adminReply}" th:text="'Admin reply: '+${t.adminReply}"></p></div><form th:if="${admin}" method="post" th:action="@{'/admin/support/'+${t.id}+'/reply'}" class="booking"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><textarea name="reply" placeholder="Reply" required></textarea><select name="status"><option>IN_PROGRESS</option><option>RESOLVED</option><option>CLOSED</option></select><button class="btn">Save reply</button></form></article><p th:if="${#lists.isEmpty(tickets)}">No tickets found.</p></main></body></html>
