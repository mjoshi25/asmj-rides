spring.application.name=asmj-ride
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/asmj_ride}
spring.data.mongodb.auto-index-creation=true
spring.thymeleaf.cache=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=70MB
app.otp.dev-mode=${OTP_DEV_MODE:false}
app.fare.base=${FARE_BASE:40}
app.fare.per-km=${FARE_PER_KM:12}
app.upload.max-bytes=${UPLOAD_MAX_BYTES:8388608}
